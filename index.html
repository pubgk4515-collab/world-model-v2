<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
/>

<meta
    name="theme-color"
    content="#050505"
/>

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
/>

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
/>

<title>
    Symbiote Studio · MoE World Model
</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
/>

<link
    rel="stylesheet"
    href="./devtools/architect/architect_styles.css"
/>

<style>

:root {

    --bg:
        #050505;

    --panel:
        rgba(255,255,255,.05);

    --panel-2:
        rgba(255,255,255,.08);

    --border:
        rgba(255,255,255,.08);

    --text:
        rgba(255,255,255,.96);

    --muted:
        rgba(255,255,255,.52);

    --violet:
        #7c3aed;

    --blue:
        #2563eb;

    --green:
        #22c55e;

    --danger:
        #ef4444;

    --radius-xl:
        34px;

    --radius-lg:
        26px;

    --radius-md:
        20px;

    --shadow:
        0 30px 100px rgba(0,0,0,.45);

    --app-width:
        620px;
}

/* ===================================================== */
/* RESET */
/* ===================================================== */

*,
*::before,
*::after {

    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {

    width: 100%;
    min-height: 100%;
    overflow-x: hidden;

    background:
        var(--bg);

    color-scheme:
        dark;
}

body {

    width: 100%;
    min-height: 100dvh;

    overflow-x: hidden;
    overflow-y: auto;

    background:

        radial-gradient(
            circle at top left,
            rgba(124,58,237,.12),
            transparent 30%
        ),

        radial-gradient(
            circle at bottom right,
            rgba(37,99,235,.10),
            transparent 32%
        ),

        var(--bg);

    color:
        var(--text);

    font-family:
        "Inter",
        system-ui,
        sans-serif;

    -webkit-font-smoothing:
        antialiased;

    text-rendering:
        optimizeLegibility;

    display: flex;
    justify-content: center;
}

/* ===================================================== */
/* ORBS */
/* ===================================================== */

.orb {

    position: fixed;

    border-radius: 999px;

    pointer-events: none;

    filter: blur(140px);

    z-index: 0;
}

.orb-a {

    width: 540px;
    height: 540px;

    left: -220px;
    top: -180px;

    background:
        radial-gradient(
            circle,
            rgba(124,58,237,.7),
            transparent 70%
        );

    animation:
        floatA 16s ease-in-out infinite;
}

.orb-b {

    width: 640px;
    height: 640px;

    right: -260px;
    bottom: -240px;

    background:
        radial-gradient(
            circle,
            rgba(37,99,235,.6),
            transparent 70%
        );

    animation:
        floatB 20s ease-in-out infinite;
}

@keyframes floatA {

    0%,100% {

        transform:
            translate3d(0,0,0)
            scale(1);
    }

    50% {

        transform:
            translate3d(24px,12px,0)
            scale(1.08);
    }
}

@keyframes floatB {

    0%,100% {

        transform:
            translate3d(0,0,0)
            scale(1);
    }

    50% {

        transform:
            translate3d(-28px,-12px,0)
            scale(1.1);
    }
}

/* ===================================================== */
/* APP */
/* ===================================================== */

.app-shell {

    position: relative;
    z-index: 2;

    width: 100%;
    max-width: var(--app-width);

    min-height: 100dvh;

    display: flex;
    flex-direction: column;

    padding:

        max(18px, env(safe-area-inset-top))

        16px

        calc(120px + env(safe-area-inset-bottom));
}

/* ===================================================== */
/* HERO */
/* ===================================================== */

.hero {

    margin-bottom: 18px;
}

.hero-top {

    display: flex;
    align-items: flex-start;
    justify-content: space-between;

    gap: 16px;
}

.hero-title {

    font-size:
        clamp(2.4rem, 8vw, 4rem);

    font-weight:
        900;

    letter-spacing:
        -.08em;

    line-height:
        .92;
}

.hero-sub {

    margin-top: 10px;

    color:
        var(--muted);

    font-size:
        .96rem;

    line-height:
        1.6;

    max-width:
        28ch;
}

.hero-status {

    flex-shrink: 0;

    padding:
        10px 14px;

    border-radius:
        999px;

    background:
        rgba(34,197,94,.12);

    border:
        1px solid rgba(34,197,94,.18);

    color:
        #86efac;

    font-size:
        .72rem;

    font-weight:
        800;

    letter-spacing:
        .14em;

    text-transform:
        uppercase;
}

/* ===================================================== */
/* GLASS */
/* ===================================================== */

.glass {

    background:

        linear-gradient(
            180deg,
            rgba(255,255,255,.07),
            rgba(255,255,255,.03)
        );

    border:
        1px solid var(--border);

    backdrop-filter:
        blur(30px);

    -webkit-backdrop-filter:
        blur(30px);

    box-shadow:
        var(--shadow);
}

/* ===================================================== */
/* ROUTER */
/* ===================================================== */

#routerConsole {

    border-radius:
        var(--radius-xl);

    padding:
        22px;

    display:
        flex;

    flex-direction:
        column;

    gap:
        22px;

    margin-bottom:
        18px;
}

.console-header {

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 12px;
}

.console-title {

    font-size:
        1.1rem;

    font-weight:
        800;

    letter-spacing:
        -.04em;
}

.console-pill {

    padding:
        8px 12px;

    border-radius:
        999px;

    background:
        rgba(255,255,255,.06);

    border:
        1px solid rgba(255,255,255,.08);

    color:
        rgba(255,255,255,.62);

    font-size:
        .72rem;

    font-weight:
        800;

    letter-spacing:
        .12em;

    text-transform:
        uppercase;
}

.control {

    display:
        flex;

    flex-direction:
        column;

    gap:
        12px;
}

.control-row {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;
}

.control-label {

    color:
        rgba(255,255,255,.62);

    font-size:
        .78rem;

    font-weight:
        800;

    letter-spacing:
        .12em;

    text-transform:
        uppercase;
}

.control-value {

    font-size:
        .88rem;

    font-weight:
        800;

    color:
        rgba(255,255,255,.88);
}

select {

    width:
        100%;

    border:
        none;

    outline:
        none;

    border-radius:
        var(--radius-md);

    padding:
        16px 18px;

    background:
        rgba(255,255,255,.06);

    border:
        1px solid rgba(255,255,255,.08);

    color:
        white;

    font-size:
        16px;

    font-weight:
        700;
}

option {

    background:
        #111;
}

input[type="range"] {

    width:
        100%;

    height:
        8px;

    appearance:
        none;

    border-radius:
        999px;

    background:

        linear-gradient(
            90deg,
            var(--violet),
            var(--blue)
        );
}

input[type="range"]::-webkit-slider-thumb {

    appearance:
        none;

    width:
        28px;

    height:
        28px;

    border-radius:
        50%;

    background:
        white;

    box-shadow:
        0 0 0 6px rgba(255,255,255,.08);
}

/* ===================================================== */
/* RACK */
/* ===================================================== */

#expertRack {

    display:
        flex;

    flex-direction:
        column;

    gap:
        18px;

    width:
        100%;
}

/* ===================================================== */
/* SYSTEM BAR */
/* ===================================================== */

.system-bar {

    display:
        grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:
        12px;

    margin-bottom:
        18px;
}

.system-tile {

    border-radius:
        24px;

    padding:
        18px;

    background:
        rgba(255,255,255,.04);

    border:
        1px solid rgba(255,255,255,.06);
}

.system-tile-label {

    color:
        rgba(255,255,255,.46);

    font-size:
        .72rem;

    font-weight:
        800;

    letter-spacing:
        .12em;

    text-transform:
        uppercase;

    margin-bottom:
        10px;
}

.system-tile-value {

    font-size:
        1.4rem;

    font-weight:
        900;

    letter-spacing:
        -.06em;
}

/* ===================================================== */
/* DOCK */
/* ===================================================== */

.bottom-dock {

    position:
        fixed;

    left:
        50%;

    transform:
        translateX(-50%);

    bottom:
        0;

    z-index:
        50;

    width:
        100%;

    max-width:
        var(--app-width);

    padding:

        14px

        16px

        calc(18px + env(safe-area-inset-bottom));

    background:

        linear-gradient(
            180deg,
            rgba(0,0,0,0),
            rgba(0,0,0,.88)
        );
}

#addLayerBtn {

    width:
        100%;

    border:
        none;

    outline:
        none;

    border-radius:
        28px;

    min-height:
        68px;

    background:

        linear-gradient(
            135deg,
            rgba(124,58,237,.92),
            rgba(37,99,235,.92)
        );

    color:
        white;

    font-size:
        1rem;

    font-weight:
        900;

    letter-spacing:
        -.02em;

    cursor:
        pointer;

    box-shadow:
        0 18px 40px rgba(37,99,235,.28);
}

/* ===================================================== */
/* MODAL */
/* ===================================================== */

#layerModal {

    position:
        fixed;

    inset:
        0;

    z-index:
        100;

    display:
        flex;

    align-items:
        flex-end;

    justify-content:
        center;

    background:
        rgba(0,0,0,.52);

    opacity:
        0;

    pointer-events:
        none;

    transition:
        opacity .25s ease;
}

#layerModal.open {

    opacity:
        1;

    pointer-events:
        auto;
}

.sheet {

    width:
        100%;

    max-width:
        var(--app-width);

    border-radius:
        34px 34px 0 0;

    padding:

        16px

        16px

        calc(24px + env(safe-area-inset-bottom));

    transform:
        translateY(100%);

    transition:
        transform .4s cubic-bezier(.2,.8,.2,1);

    display:
        flex;

    flex-direction:
        column;

    gap:
        12px;
}

#layerModal.open .sheet {

    transform:
        translateY(0%);
}

.sheet-handle {

    width:
        48px;

    height:
        5px;

    border-radius:
        999px;

    background:
        rgba(255,255,255,.18);

    margin:
        4px auto 12px;
}

.sheet-title {

    font-size:
        1.1rem;

    font-weight:
        900;

    letter-spacing:
        -.04em;
}

.sheet-sub {

    color:
        rgba(255,255,255,.54);

    line-height:
        1.6;

    margin-bottom:
        8px;
}

.sheet-btn {

    width:
        100%;

    border:
        none;

    outline:
        none;

    border-radius:
        22px;

    min-height:
        66px;

    padding:
        18px;

    background:
        rgba(255,255,255,.05);

    border:
        1px solid rgba(255,255,255,.06);

    color:
        white;

    text-align:
        left;

    font-size:
        1rem;

    font-weight:
        800;

    cursor:
        pointer;
}

/* ===================================================== */
/* MOBILE */
/* ===================================================== */

@media (max-width: 640px) {

    .system-bar {

        grid-template-columns:
            1fr;
    }

    .app-shell {

        padding-left:
            12px;

        padding-right:
            12px;
    }

    .bottom-dock {

        padding-left:
            12px;

        padding-right:
            12px;
    }
}

</style>

</head>

<body>

<!-- ================================================== -->
<!-- ORBS -->
<!-- ================================================== -->

<div class="orb orb-a"></div>
<div class="orb orb-b"></div>

<!-- ================================================== -->
<!-- APP -->
<!-- ================================================== -->

<main class="app-shell">

    <!-- HERO -->

    <header class="hero">

        <div class="hero-top">

            <div>

                <h1 class="hero-title">
                    Symbiote Studio
                </h1>

                <p class="hero-sub">
                    Modular procedural atmosphere engine
                    powered by MoE world modeling.
                </p>

            </div>

            <div class="hero-status">
                LIVE
            </div>

        </div>

    </header>

    <!-- SYSTEM -->

    <section class="system-bar">

        <div class="system-tile">

            <div class="system-tile-label">
                Engine
            </div>

            <div class="system-tile-value">
                Stable
            </div>

        </div>

        <div class="system-tile">

            <div class="system-tile-label">
                Audio
            </div>

            <div
                class="system-tile-value"
                id="audioStateValue"
            >
                Ready
            </div>

        </div>

        <div class="system-tile">

            <div class="system-tile-label">
                Experts
            </div>

            <div
                class="system-tile-value"
                id="expertCountValue"
            >
                0
            </div>

        </div>

    </section>

    <!-- ROUTER -->

    <section
        id="routerConsole"
        class="glass"
    >

        <div class="console-header">

            <div class="console-title">
                Router Console
            </div>

            <div class="console-pill">
                Global State
            </div>

        </div>

        <!-- ENCLOSURE -->

        <div class="control">

            <div class="control-row">

                <div class="control-label">
                    Enclosure
                </div>

            </div>

            <select id="enclosureSelect">

                <option value="open">
                    Open Air
                </option>

                <option value="indoor">
                    Indoor
                </option>

                <option value="umbrella">
                    Umbrella
                </option>

            </select>

        </div>

        <!-- PRESSURE -->

        <div class="control">

            <div class="control-row">

                <div class="control-label">
                    Atmospheric Pressure
                </div>

                <div
                    id="pressureValue"
                    class="control-value"
                >
                    0.50
                </div>

            </div>

            <input
                id="pressureSlider"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.5"
            />

        </div>

    </section>

    <!-- EXPERTS -->

    <section
        id="expertRack"
        aria-label="Experts"
    ></section>

</main>

<!-- ================================================== -->
<!-- BOTTOM DOCK -->
<!-- ================================================== -->

<div class="bottom-dock">

    <button
        id="addLayerBtn"
        type="button"
    >
        Add Acoustic Expert
    </button>

</div>

<!-- ================================================== -->
<!-- MODAL -->
<!-- ================================================== -->

<div
    id="layerModal"
    aria-hidden="true"
>

    <div
        class="sheet glass"
        role="dialog"
    >

        <div class="sheet-handle"></div>

        <div class="sheet-title">
            Inject Acoustic Expert
        </div>

        <div class="sheet-sub">
            Dynamically expand the world model
            with procedural atmosphere modules.
        </div>

        <button
            class="sheet-btn"
            data-expert="wind"
            type="button"
        >
            🌬️ Atmosphere · Wind
        </button>

        <button
            class="sheet-btn"
            data-expert="rain"
            type="button"
        >
            🌧️ Atmosphere · Rain
        </button>

        <button
            class="sheet-btn"
            id="openArchitectBtn"
            type="button"
        >
            🧠 Developer · Architect Console
        </button>

    </div>

</div>

<!-- ================================================== -->
<!-- APP -->
<!-- ================================================== -->

<script type="module">

import './app.js';

import {
    createArchitectPanel
} from './devtools/architect/architect_panel.js';

const modal =
    document.getElementById(
        'layerModal'
    );

const openArchitectBtn =
    document.getElementById(
        'openArchitectBtn'
    );

openArchitectBtn?.addEventListener(
    'click',
    () => {

        modal?.classList.remove('open');

        createArchitectPanel();
    }
);

</script>

</body>
</html>
